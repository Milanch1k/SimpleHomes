name: SimpleHomes
version: '1.1.0'
main: net.milanchik.simpleHomes.SimpleHomes
api-version: '1.21'
authors: [ Milanchik ]
description: A plugin that adds homes by beds
website: https://github.com/Milanch1k
commands:
  homes:
    aliases:
      - homegui
    permission: simplehomes.homes
  simplehomes:
    permission: simplehomes.simplehomes
  home:
      permission: simplehomes.home
  SHStreamerMode:
    permission: simplehomes.shstreamermode
    aliases:
      - shstreamermode

permissions:
  simplehomes.homes:
    default: true
  simplehomes.simplehomes:
    default: op